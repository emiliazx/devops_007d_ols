# PLANTILLA. NO se incluye en kustomization.yml y NO debe contener valores reales.
# El Secret real lo crea scripts/deploy-k8s.sh con `kubectl create secret`,
# o manualmente:
#   kubectl -n ms-auth create secret generic ms-auth-secret \
#     --from-literal=DB_PASSWORD='...' --from-literal=JWT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: ms-auth-secret
  namespace: ms-auth
type: Opaque
stringData:
  DB_PASSWORD: REEMPLAZAR_CON_CONTRASENA_SEGURA
  JWT_SECRET: REEMPLAZAR_CON_CLAVE_BASE64
