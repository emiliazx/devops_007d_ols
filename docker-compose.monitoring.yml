# Uso local:  docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
# Prometheus quedará en http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ms-auth-prometheus
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy
