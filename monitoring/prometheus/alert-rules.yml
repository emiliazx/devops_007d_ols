groups:
  - name: ms-auth-disponibilidad
    rules:
      - alert: MsAuthCaido
        expr: up{job="ms-auth"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instancia de ms-auth sin responder ({{ $labels.instance }})"
          description: "Prometheus no puede leer /actuator/prometheus hace más de 1 minuto."

  - name: ms-auth-errores
    rules:
      - alert: MsAuthTasaErrores5xxAlta
        expr: |
          sum(rate(http_server_requests_seconds_count{job="ms-auth",status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="ms-auth"}[5m])), 0.001) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Más del 5 % de las respuestas HTTP son errores 5xx"
          description: "Decisión: detener promoción de la versión y revisar el último despliegue."
      - alert: MsAuthErroresEnLogs
        expr: increase(logback_events_total{job="ms-auth",level="error"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Más de 5 errores registrados en logs en 5 minutos ({{ $labels.instance }})"

  - name: ms-auth-recursos
    rules:
      - alert: MsAuthCpuAlta
        expr: process_cpu_usage{job="ms-auth"} > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de CPU sobre 80 % por 5 minutos ({{ $labels.instance }})"
          description: "Decisión: revisar límites de CPU o aumentar réplicas."
      - alert: MsAuthHeapAlto
        expr: |
          sum by (instance) (jvm_memory_used_bytes{job="ms-auth",area="heap"})
            /
          sum by (instance) (jvm_memory_max_bytes{job="ms-auth",area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Heap JVM sobre 85 % ({{ $labels.instance }})"
          description: "Decisión: revisar fugas de memoria o subir el límite de memoria del pod."
      - alert: MsAuthLatenciaP95Alta
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="ms-auth"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 sobre 1 segundo"
