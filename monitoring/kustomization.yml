apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yml
  - app-deployment.yaml
  - service.yaml
  - mysql-deployment.yaml
  - mysql-service.yaml

configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml=prometheus/prometheus-k8s.yml
      - alert-rules.yml=prometheus/alert-rules.yml

generatorOptions:
  disableNameSuffixHash: true