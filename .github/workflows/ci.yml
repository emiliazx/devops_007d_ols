name: CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y probar con Maven
        run: mvn clean verify

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Analizar dependencias con Snyk
        run: snyk test --debug --log-level=trace
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Análisis de código estático con SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=emiliazx_devops_007d_ols \
            -Dsonar.organization=emiliazx \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Construir imagen Docker
        run: docker build -t ms-auth:latest .