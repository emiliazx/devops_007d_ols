name: CI/CD Pipeline

on:
  push:
    branches: ["develop", "main", "feature/**", "ci/**"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Compilar y probar con Maven
        run: ./mvnw -B clean verify
      - name: Publicar cobertura JaCoCo
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Instalar Snyk CLI
        run: npm install --global --ignore-scripts snyk@1.1308.1
      - name: Analizar dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN"
          if [ -f .snyk ]; then
            snyk test --file=pom.xml --policy-path=.snyk --severity-threshold=high
          else
            snyk test --file=pom.xml --severity-threshold=high
          fi

  gitleaks:
    name: Gitleaks secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout completo del historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analizar historial con Gitleaks
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --exit-code 1 --log-opts="--all" .

  sonarcloud:
    name: SonarCloud and Quality Gate
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Ejecutar pruebas, cobertura y Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=emiliazx_devops_007d_ols \
            -Dsonar.organization=emiliazx \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Construir imagen Docker
        run: docker build --tag ms-auth:${GITHUB_SHA} .

  deploy-smoke-test:
    name: Deploy smoke test
    needs: [build-and-test, security, sonarcloud, docker-build, gitleaks]
    if: ${{ success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar credenciales efímeras
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          umask 077
          cat > .env <<EOF
          DB_NAME=authentication
          DB_USER=root
          DB_PASSWORD=$db_password
          JWT_SECRET=$jwt_secret
          EUREKA_ENABLED=false
          EUREKA_URL=http://localhost:8761/eureka/
          ADMIN_ENABLED=false
          ADMIN_USERNAME=
          ADMIN_EMAIL=
          ADMIN_PASSWORD=
          EOF
      - name: Validar configuración Compose
        run: docker compose config --quiet
      - name: Levantar despliegue temporal y esperar healthchecks
        run: docker compose up --detach --build --wait --wait-timeout 240
      - name: Verificar servicios saludables
        run: |
          set -euo pipefail
          docker compose ps
          response="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://localhost:8080/actuator/health)"
          echo "$response"
          grep -q '"status":"UP"' <<< "$response"
      - name: Diagnóstico de Compose ante fallo
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Limpiar contenedores, volúmenes y redes temporales
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
      - name: Eliminar variables temporales
        if: ${{ always() }}
        run: rm -f .env
