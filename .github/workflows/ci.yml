name: CI/CD Pipeline

on:
  push:
    branches: ["develop", "main", "feature/**", "ci/**"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Preparar Maven Wrapper con reintentos limitados
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./mvnw -v; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "Maven Wrapper no disponible; reintento $((attempt + 1))/3 en ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "ERROR: Maven Wrapper no pudo descargar Maven después de 3 intentos" >&2
          exit 1
      - name: Compilar y probar con Maven
        run: ./mvnw -B -Dmaven.wagon.http.retryHandler.count=2 clean verify
      - name: Publicar cobertura JaCoCo
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Preparar Maven Wrapper con reintentos limitados
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./mvnw -v; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "Maven Wrapper no disponible; reintento $((attempt + 1))/3 en ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "ERROR: Maven Wrapper no pudo descargar Maven después de 3 intentos" >&2
          exit 1
      - name: Instalar Snyk CLI
        run: npm install --global --ignore-scripts snyk@1.1308.1
      - name: Analizar dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN"
          if [ -f .snyk ]; then
            snyk test --file=pom.xml --policy-path=.snyk --severity-threshold=high --maven-wrapper=./mvnw
          else
            snyk test --file=pom.xml --severity-threshold=high --maven-wrapper=./mvnw
          fi

  gitleaks:
    name: Gitleaks secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout completo del historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Analizar historial con Gitleaks
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --exit-code 1 --log-opts="--all" .

  sonarcloud:
    name: SonarCloud and Quality Gate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Preparar Maven Wrapper con reintentos limitados
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./mvnw -v; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "Maven Wrapper no disponible; reintento $((attempt + 1))/3 en ${delay}s" >&2
              sleep "$delay"
            fi
          done
          echo "ERROR: Maven Wrapper no pudo descargar Maven después de 3 intentos" >&2
          exit 1
      - name: Ejecutar pruebas, cobertura y Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          ./mvnw -B -Dmaven.wagon.http.retryHandler.count=2 clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=emiliazx \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Dsonar.projectKey=emiliazx_devops_007d_ols2 # gitleaks:allow

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Construir imagen Docker
        run: docker build --tag ms-auth:${GITHUB_SHA} .

  compliance:
    name: Compliance audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Instalar PyYAML
        run: pip install pyyaml==6.0.2
      - name: Auditar manifiestos, pipeline y repositorio
        run: python3 scripts/auditoria_cumplimiento.py

  k8s-validate:
    name: Kubernetes manifests validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Validar manifiestos de la aplicación (kubeconform)
        run: |
          set -euo pipefail
          kubectl kustomize k8s | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
      - name: Validar manifiestos de monitoreo (kubeconform)
        run: |
          set -euo pipefail
          kubectl kustomize monitoring | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
      - name: Validar reglas de alerta (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "${GITHUB_WORKSPACE}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check rules /etc/prometheus/alert-rules.yml
      - name: Probar ciclo de MsAuthCaido con promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "${GITHUB_WORKSPACE}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 test rules /etc/prometheus/alert-tests.yml
      - name: Validar configuración de Prometheus (promtool)
        run: |
          for f in prometheus.yml prometheus-k8s.yml; do
            docker run --rm --entrypoint promtool \
              -v "${GITHUB_WORKSPACE}/monitoring/prometheus/${f}:/etc/prometheus/prometheus.yml:ro" \
              -v "${GITHUB_WORKSPACE}/monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro" \
              prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          done

  trivy-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build --tag ms-auth:1.1.0 .
      - name: Escanear imagen (falla ante vulnerabilidades CRITICAL con parche)
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress ms-auth:1.1.0

  k8s-deploy:
    name: Kubernetes deploy (kind)
    needs: [build-and-test, security, gitleaks, docker-build, compliance, k8s-validate, trivy-scan, sonarcloud]
    if: >-
      ${{ always() &&
      needs.build-and-test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.gitleaks.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.compliance.result == 'success' &&
      needs.k8s-validate.result == 'success' &&
      needs.trivy-scan.result == 'success' &&
      (github.ref != 'refs/heads/main' || needs.sonarcloud.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Descargar cobertura JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: .ci-dashboard
      - name: Construir imagen
        run: docker build --tag ms-auth:1.1.0 .
      - name: Crear cluster Kubernetes (kind)
        run: |
          kind create cluster --name ms-auth --wait 120s
          kind load docker-image ms-auth:1.1.0 --name ms-auth
      - name: Iniciar medición de despliegue kind
        run: echo "KIND_DEPLOY_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Desplegar aplicación, MySQL y Prometheus
        run: |
          set -euo pipefail
          export DB_PASSWORD="$(openssl rand -hex 24)"
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          ./scripts/deploy-k8s.sh
      - name: Verificar salud, métricas y scraping
        run: ./scripts/verificar-observabilidad.sh
      - name: Verificar logs anonimizados de ms-auth y MySQL
        run: bash scripts/verificar-logs-k8s.sh
      - name: Generar tablero IE3 desde Prometheus
        run: |
          set -euo pipefail
          kubectl -n monitoring port-forward svc/prometheus 19090:9090 >/dev/null 2>&1 &
          prometheus_pid=$!
          cleanup_prometheus() {
            if kill "$prometheus_pid" 2>/dev/null; then
              :
            else
              echo "No se pudo detener el port-forward de Prometheus (PID $prometheus_pid)" >&2
            fi
          }
          trap cleanup_prometheus EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:19090/-/ready >/dev/null
          rejection_args=()
          if [ -n "${HTTP_REJECTION_CODE:-}" ]; then
            rejection_args+=(--http-rejection-code "$HTTP_REJECTION_CODE")
          fi
          if [ -n "${HTTP_REJECTION_INCREMENT:-}" ]; then
            rejection_args+=(--http-rejection-count "$HTTP_REJECTION_INCREMENT")
          fi
          python3 scripts/generar_dashboard.py \
            --jacoco .ci-dashboard/jacoco.xml \
            --prometheus-url http://127.0.0.1:19090 \
            --output ci-dashboard.html \
            --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --environment kind \
            --deploy-start-ms "$KIND_DEPLOY_START_MS" \
            --deploy-end-ms "$KIND_DEPLOY_END_MS" \
            "${rejection_args[@]}"
      - name: Publicar tablero IE3
        uses: actions/upload-artifact@v4
        with:
          name: ie3-dashboard-${{ github.sha }}
          path: ci-dashboard.html
          if-no-files-found: error
      - name: Diagnóstico ante fallo
        if: ${{ failure() }}
        run: |
          set +e
          kubectl get pods -A
          kubectl -n ms-auth describe pods
          bash scripts/verificar-logs-k8s.sh
      - name: Eliminar cluster
        if: ${{ always() }}
        run: kind delete cluster --name ms-auth

  deploy-smoke-test:
    name: Deploy smoke test
    needs: [build-and-test, security, sonarcloud, docker-build, gitleaks, compliance, k8s-validate, trivy-scan, k8s-deploy]
    if: >-
      ${{ always() &&
      needs.build-and-test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.gitleaks.result == 'success' &&
      needs.compliance.result == 'success' &&
      needs.k8s-validate.result == 'success' &&
      needs.trivy-scan.result == 'success' &&
      needs.k8s-deploy.result == 'success' &&
      ((github.event_name == 'pull_request') ||
       (github.ref == 'refs/heads/main' && needs.sonarcloud.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar credenciales efímeras
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          umask 077
          cat > .env <<EOF
          DB_NAME=authentication
          DB_USER=root
          DB_PASSWORD=$db_password
          JWT_SECRET=$jwt_secret
          EUREKA_ENABLED=false
          EUREKA_URL=http://localhost:8761/eureka/
          ADMIN_ENABLED=false
          ADMIN_USERNAME=
          ADMIN_EMAIL=
          ADMIN_PASSWORD=
          EOF
      - name: Validar configuración Compose
        run: docker compose config --quiet
      - name: Levantar despliegue temporal y esperar healthchecks
        run: docker compose up --detach --build --wait --wait-timeout 240
      - name: Verificar servicios saludables
        run: |
          set -euo pipefail
          docker compose ps
          response="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://localhost:8080/actuator/health)"
          echo "$response"
          grep -q '"status":"UP"' <<< "$response"
      - name: Diagnóstico de Compose ante fallo
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Limpiar contenedores, volúmenes y redes temporales
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
      - name: Eliminar variables temporales
        if: ${{ always() }}
        run: rm -f .env

  ci-gate:
    name: CI gate
    needs: [build-and-test, security, sonarcloud, docker-build, gitleaks, compliance, k8s-validate, trivy-scan, k8s-deploy, deploy-smoke-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar controles obligatorios
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          COMPLIANCE_RESULT: ${{ needs.compliance.result }}
          K8S_VALIDATE_RESULT: ${{ needs.k8s-validate.result }}
          TRIVY_RESULT: ${{ needs.trivy-scan.result }}
          K8S_DEPLOY_RESULT: ${{ needs.k8s-deploy.result }}
          SMOKE_RESULT: ${{ needs.deploy-smoke-test.result }}
          SONAR_REQUIRED: ${{ github.ref == 'refs/heads/main' }}
          SMOKE_REQUIRED: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -u
          failed=0

          check_result() {
            local name="$1"
            local result="$2"
            local required="$3"
            echo "${name}: ${result} (required=${required})"
            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              echo "FAIL: ${name} no terminó en success."
              failed=1
            fi
          }

          check_result "Build and test" "$BUILD_RESULT" true
          check_result "Security scan" "$SECURITY_RESULT" true
          check_result "Docker build" "$DOCKER_RESULT" true
          check_result "Gitleaks secret scanning" "$GITLEAKS_RESULT" true
          check_result "Compliance audit" "$COMPLIANCE_RESULT" true
          check_result "Kubernetes manifests validation" "$K8S_VALIDATE_RESULT" true
          check_result "Container image scan" "$TRIVY_RESULT" true
          check_result "Kubernetes deploy (kind)" "$K8S_DEPLOY_RESULT" true
          check_result "SonarCloud and Quality Gate" "$SONAR_RESULT" "$SONAR_REQUIRED"
          check_result "Deploy smoke test" "$SMOKE_RESULT" "$SMOKE_REQUIRED"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  openshift-build:
    name: OpenShift Build (cloud)
    needs: ci-gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.ci-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Disparar compilación de OpenShift
        env:
          OPENSHIFT_BUILD_WEBHOOK: ${{ secrets.OPENSHIFT_BUILD_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENSHIFT_BUILD_WEBHOOK" ]; then
            echo "ERROR: falta el secreto OPENSHIFT_BUILD_WEBHOOK" >&2
            exit 1
          fi

          if ! response_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$OPENSHIFT_BUILD_WEBHOOK")"; then
            echo "ERROR: no fue posible contactar el webhook de OpenShift" >&2
            exit 1
          fi

          case "$response_code" in
            2??)
              echo "OpenShift aceptó la solicitud de compilación."
              ;;
            *)
              echo "ERROR: OpenShift rechazó la solicitud de compilación (HTTP $response_code)" >&2
              exit 1
              ;;
          esac
