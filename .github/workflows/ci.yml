name: CI/CD Pipeline

on:
  push:
    branches: ["develop", "main", "feature/**", "ci/**"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Compilar y probar con Maven
        run: ./mvnw -B clean verify
      - name: Publicar cobertura JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Instalar Snyk CLI
        run: npm install --global --ignore-scripts snyk@1.1308.1
      - name: Analizar dependencias con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN"
          if [ -f .snyk ]; then
            snyk test --file=pom.xml --policy-path=.snyk --severity-threshold=high --maven-wrapper=./mvnw
          else
            snyk test --file=pom.xml --severity-threshold=high --maven-wrapper=./mvnw
          fi

  gitleaks:
    name: Gitleaks secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout completo del historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Analizar historial con Gitleaks
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --exit-code 1 --log-opts="--all" .

  sonarcloud:
    name: SonarCloud and Quality Gate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Habilitar Maven Wrapper
        run: chmod +x mvnw
      - name: Ejecutar pruebas, cobertura y Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=emiliazx \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Dsonar.projectKey=emiliazx_devops_007d_ols2 # gitleaks:allow

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Construir imagen Docker
        run: docker build --tag ms-auth:${GITHUB_SHA} .

  compliance:
    name: Compliance audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Instalar PyYAML
        run: pip install pyyaml==6.0.2
      - name: Auditar manifiestos, pipeline y repositorio
        run: python3 scripts/auditoria_cumplimiento.py

  k8s-validate:
    name: Kubernetes manifests validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Validar manifiestos de la aplicación (kubeconform)
        run: |
          set -euo pipefail
          kubectl kustomize k8s | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
      - name: Validar manifiestos de monitoreo (kubeconform)
        run: |
          set -euo pipefail
          kubectl kustomize monitoring | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
      - name: Validar reglas de alerta (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "${GITHUB_WORKSPACE}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check rules /etc/prometheus/alert-rules.yml
      - name: Validar configuración de Prometheus (promtool)
        run: |
          for f in prometheus.yml prometheus-k8s.yml; do
            docker run --rm --entrypoint promtool \
              -v "${GITHUB_WORKSPACE}/monitoring/prometheus/${f}:/etc/prometheus/prometheus.yml:ro" \
              -v "${GITHUB_WORKSPACE}/monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro" \
              prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          done

  trivy-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build --tag ms-auth:1.1.0 .
      - name: Escanear imagen (falla ante vulnerabilidades CRITICAL con parche)
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --scanners vuln --severity CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress ms-auth:1.1.0

  k8s-deploy:
    name: Kubernetes deploy (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build --tag ms-auth:1.1.0 .
      - name: Crear cluster Kubernetes (kind)
        run: |
          kind create cluster --name ms-auth --wait 120s
          kind load docker-image ms-auth:1.1.0 --name ms-auth
      - name: Desplegar aplicación, MySQL y Prometheus
        run: |
          set -euo pipefail
          export DB_PASSWORD="$(openssl rand -hex 24)"
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          ./scripts/deploy-k8s.sh
      - name: Verificar salud, métricas y scraping
        run: ./scripts/verificar-observabilidad.sh
      - name: Diagnóstico ante fallo
        if: ${{ failure() }}
        run: |
          set +e
          kubectl get pods -A
          kubectl -n ms-auth describe pods
          kubectl -n ms-auth logs deployment/ms-auth --tail=200
          kubectl -n monitoring logs deployment/prometheus --tail=100
      - name: Eliminar cluster
        if: ${{ always() }}
        run: kind delete cluster --name ms-auth

  deploy-smoke-test:
    name: Deploy smoke test
    needs: [build-and-test, security, sonarcloud, docker-build, gitleaks, compliance, k8s-validate, trivy-scan, k8s-deploy]
    if: ${{ success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generar credenciales efímeras
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          umask 077
          cat > .env <<EOF
          DB_NAME=authentication
          DB_USER=root
          DB_PASSWORD=$db_password
          JWT_SECRET=$jwt_secret
          EUREKA_ENABLED=false
          EUREKA_URL=http://localhost:8761/eureka/
          ADMIN_ENABLED=false
          ADMIN_USERNAME=
          ADMIN_EMAIL=
          ADMIN_PASSWORD=
          EOF
      - name: Validar configuración Compose
        run: docker compose config --quiet
      - name: Levantar despliegue temporal y esperar healthchecks
        run: docker compose up --detach --build --wait --wait-timeout 240
      - name: Verificar servicios saludables
        run: |
          set -euo pipefail
          docker compose ps
          response="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://localhost:8080/actuator/health)"
          echo "$response"
          grep -q '"status":"UP"' <<< "$response"
      - name: Diagnóstico de Compose ante fallo
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Limpiar contenedores, volúmenes y redes temporales
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
      - name: Eliminar variables temporales
        if: ${{ always() }}
        run: rm -f .env